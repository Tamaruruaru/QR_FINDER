<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador GSA - Planta Externa</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .search-area { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 25px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .card-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--primary); color: white; padding: 12px; font-size: 13px; }
        td { padding: 10px; border: 1px solid #eee; text-align: center; }
        .status-libre { color: var(--success); font-weight: bold; }
        .status-ocupado { color: var(--danger); font-weight: bold; }
        .maps-link { color: #fff; background: #4285F4; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ Buscador de Puertos GSA</h2>
    <div class="search-area">
        <input type="text" id="qrInput" placeholder="Ej: TP1387397" value="TP1387397">
        <button onclick="consultar()">Consultar</button>
    </div>

    <div id="status" style="display:none; text-align:center; padding: 10px; color: #666;">Buscando...</div>

    <div id="resultado" style="display:none;">
        <div class="card-info" id="headerData"></div>
        <table>
            <thead>
                <tr>
                    <th># Pto</th>
                    <th>Frame</th>
                    <th>Slot</th>
                    <th>Puerto</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    async function consultar() {
        const qr = document.getElementById('qrInput').value.trim();
        const statusDiv = document.getElementById('status');
        const resDiv = document.getElementById('resultado');

        statusDiv.innerText = "Conectando con la API...";
        statusDiv.style.display = "block";
        resDiv.style.display = "none";

        // Usamos AllOrigins para saltar el CORS
        const url = `https://apiservice.sistemastp.com.mx/gsa/lite/v1/port/qr?qr=${qr}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

        try {
            const response = await fetch(proxyUrl);
            const wrapper = await response.json();
            
            // AllOrigins devuelve el JSON dentro de una propiedad 'contents' como string
            const data = JSON.parse(wrapper.contents);
            
            if (!data) throw new Error("No se recibieron datos");
            render(data, qr);
            statusDiv.style.display = "none";
        } catch (err) {
            console.error(err);
            statusDiv.innerText = "Error: El servidor de la API bloqueó la conexión. Prueba de nuevo en unos segundos.";
            statusDiv.style.color = "red";
        }
    }

    function render(data, qr) {
        const header = document.getElementById('headerData');
        const body = document.getElementById('tableBody');
        
        const lat = data.latitud || 0;
        const lon = data.longitud || 0;
        const maps = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
        const puertos = data.puertos || [];
        const libres = puertos.filter(p => String(p.status).toUpperCase() === 'LIBRE').length;

        header.innerHTML = `
            <div><b>QR:</b><br>${qr}</div>
            <div><b>Nombre:</b><br>${data.nombre || 'N/A'}</div>
            <div><b>Libres:</b><br><span style="color:green">${libres}</span> / ${puertos.length}</div>
            <div><b>Ubicación:</b><br><a href="${maps}" target="_blank" class="maps-link">📍 Ver Maps</a></div>
        `;

        body.innerHTML = "";
        puertos.forEach((p, i) => {
            const isLibre = String(p.status).toUpperCase() === 'LIBRE';
            body.insertAdjacentHTML('beforeend', `
                <tr>
                    <td>${i + 1}</td>
                    <td>${p.frame || data.frame || '0'}</td>
                    <td>${p.slot || '0'}</td>
                    <td>${p.puerto || '0'}</td>
                    <td><span class="${isLibre ? 'status-libre' : 'status-ocupado'}">${p.status}</span></td>
                </tr>
            `);
        });

        document.getElementById('resultado').style.display = 'block';
    }
</script>

</body>
</html>
